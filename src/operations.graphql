query Books($search: String, $limit: Int, $offset: Int) {
  books(search: $search, limit: $limit, offset: $offset) {
    total
    items {
      id
      title
      author
      genre
      description
      priceCents
      stock
    }
  }
  genres
}

query Book($id: ID!) {
  book(id: $id) {
    id
    title
    author
    genre
    description
    priceCents
    stock
  }
}

mutation PlaceOrder($input: PlaceOrderInput!) {
  placeOrder(input: $input) {
    id
    totalCents
    status
    items {
      title
      quantity
      unitPriceCents
    }
  }
}

query MyOrders($limit: Int, $offset: Int) {
  myOrders(limit: $limit, offset: $offset) {
    total
    items {
      id
      createdAt
      status
      totalCents
      items {
        title
        quantity
        unitPriceCents
      }
    }
  }
}

query Viewer {
  viewer {
    id
    role
  }
}
fragment AdminBookFields on AdminBook {
  id
  title
  author
  genre
  description
  priceCents
  stock
  archived
}
query AdminBooks(
  $search: String
  $filter: AdminBookFilter
  $lowStockOnly: Boolean
  $limit: Int
  $offset: Int
) {
  adminBooks(
    search: $search
    filter: $filter
    lowStockOnly: $lowStockOnly
    limit: $limit
    offset: $offset
  ) {
    total
    items {
      ...AdminBookFields
    }
  }
}
query AdminBook($id: ID!) {
  adminBook(id: $id) {
    ...AdminBookFields
  }
}
mutation CreateBook($input: CreateBookInput!) {
  createBook(input: $input) {
    ...AdminBookFields
  }
}
mutation UpdateBook($id: ID!, $input: AdminBookDetailsInput!) {
  updateBook(id: $id, input: $input) {
    ...AdminBookFields
  }
}
mutation AdjustBookStock($id: ID!, $delta: Int!) {
  adjustBookStock(id: $id, delta: $delta) {
    ...AdminBookFields
  }
}
mutation SetBookArchived($id: ID!, $archived: Boolean!) {
  setBookArchived(id: $id, archived: $archived) {
    ...AdminBookFields
  }
}
fragment AdminOrderFields on AdminOrder {
  id
  userId
  status
  customerName
  email
  createdAt
  totalCents
  items {
    title
    quantity
    unitPriceCents
  }
}
query AdminOrders($status: OrderStatusFilter, $limit: Int, $offset: Int) {
  adminOrders(status: $status, limit: $limit, offset: $offset) {
    total
    items {
      ...AdminOrderFields
    }
  }
}
fragment AdminOrderDetail on AdminOrder {
  ...AdminOrderFields
  history {
    id
    fromStatus
    toStatus
    createdAt
    cancellationReason
    actorName
    actorRole
  }
}
query AdminOrder($id: ID!) {
  adminOrder(id: $id) {
    ...AdminOrderDetail
  }
}
mutation SetOrderStatus($input: SetOrderStatusInput!) {
  setOrderStatus(input: $input) {
    ...AdminOrderDetail
  }
}
query MyOrder($id: ID!) {
  myOrder(id: $id) {
    id
    createdAt
    totalCents
    status
    items {
      title
      quantity
      unitPriceCents
    }
    history {
      id
      fromStatus
      toStatus
      createdAt
      cancellationReason
    }
  }
}
fragment AdminUserFields on AdminUser {
  id
  name
  email
  role
  createdAt
}
query AdminUsers($search: String, $role: AdminUserRoleFilter, $limit: Int, $offset: Int) {
  adminUsers(search: $search, role: $role, limit: $limit, offset: $offset) {
    total
    items {
      ...AdminUserFields
    }
  }
}
mutation SetUserRole($userId: ID!, $role: UserRole!) {
  setUserRole(userId: $userId, role: $role) {
    ...AdminUserFields
  }
}
query AdminUser($id: ID!) {
  adminUser(id: $id) {
    ...AdminUserFields
  }
}
mutation ResetUserPassword($userId: ID!, $newPassword: String!) {
  resetUserPassword(userId: $userId, newPassword: $newPassword) {
    ...AdminUserFields
  }
}

fragment ActivityEventFields on ActivityEvent {
  id
  actorUserId
  actorName
  actorRole
  source
  action
  targetType
  targetId
  targetName
  changes {
    field
    before
    after
  }
  stockDelta
  createdAt
}
query AdminActivity(
  $actorUserId: ID
  $action: ActivityAction
  $changedField: ActivityField
  $targetType: ActivityTargetType
  $targetId: ID
  $from: String
  $to: String
  $limit: Int
  $offset: Int
) {
  adminActivity(
    actorUserId: $actorUserId
    action: $action
    changedField: $changedField
    targetType: $targetType
    targetId: $targetId
    from: $from
    to: $to
    limit: $limit
    offset: $offset
  ) {
    total
    items {
      ...ActivityEventFields
    }
  }
}
