query Books($search: String, $limit: Int, $offset: Int) {
  books(search: $search, limit: $limit, offset: $offset) {
    total
    items {
      id
      title
      author
      genre
      description
      priceCents
      stock
    }
  }
  genres
}

query Book($id: ID!) {
  book(id: $id) {
    id
    title
    author
    genre
    description
    priceCents
    stock
  }
}

mutation PlaceOrder($input: PlaceOrderInput!) {
  placeOrder(input: $input) {
    id
    totalCents
    items {
      title
      quantity
      unitPriceCents
    }
  }
}

query MyOrders($limit: Int, $offset: Int) {
  myOrders(limit: $limit, offset: $offset) {
    total
    items {
      id
      createdAt
      totalCents
      items {
        title
        quantity
        unitPriceCents
      }
    }
  }
}

query Viewer {
  viewer {
    id
    role
  }
}
fragment AdminBookFields on AdminBook {
  id
  title
  author
  genre
  description
  priceCents
  stock
  archived
}
query AdminBooks(
  $search: String
  $filter: AdminBookFilter
  $lowStockOnly: Boolean
  $limit: Int
  $offset: Int
) {
  adminBooks(
    search: $search
    filter: $filter
    lowStockOnly: $lowStockOnly
    limit: $limit
    offset: $offset
  ) {
    total
    items {
      ...AdminBookFields
    }
  }
}
query AdminBook($id: ID!) {
  adminBook(id: $id) {
    ...AdminBookFields
  }
}
mutation CreateBook($input: CreateBookInput!) {
  createBook(input: $input) {
    ...AdminBookFields
  }
}
mutation UpdateBook($id: ID!, $input: AdminBookDetailsInput!) {
  updateBook(id: $id, input: $input) {
    ...AdminBookFields
  }
}
mutation AdjustBookStock($id: ID!, $delta: Int!) {
  adjustBookStock(id: $id, delta: $delta) {
    ...AdminBookFields
  }
}
mutation SetBookArchived($id: ID!, $archived: Boolean!) {
  setBookArchived(id: $id, archived: $archived) {
    ...AdminBookFields
  }
}
fragment AdminOrderFields on AdminOrder {
  id
  userId
  customerName
  email
  createdAt
  totalCents
  items {
    title
    quantity
    unitPriceCents
  }
}
query AdminOrders($limit: Int, $offset: Int) {
  adminOrders(limit: $limit, offset: $offset) {
    total
    items {
      ...AdminOrderFields
    }
  }
}
query AdminOrder($id: ID!) {
  adminOrder(id: $id) {
    ...AdminOrderFields
  }
}
fragment AdminCustomerFields on AdminCustomer {
  id
  name
  email
  role
  createdAt
}
query AdminCustomers(
  $search: String
  $role: AdminCustomerRoleFilter
  $limit: Int
  $offset: Int
) {
  adminCustomers(search: $search, role: $role, limit: $limit, offset: $offset) {
    total
    items {
      ...AdminCustomerFields
    }
  }
}
mutation SetCustomerAdminAccess($userId: ID!, $enabled: Boolean!) {
  setCustomerAdminAccess(userId: $userId, enabled: $enabled) {
    ...AdminCustomerFields
  }
}
query AdminCustomer($id: ID!) {
  adminCustomer(id: $id) {
    ...AdminCustomerFields
  }
}
mutation ResetCustomerPassword($userId: ID!, $newPassword: String!) {
  resetCustomerPassword(userId: $userId, newPassword: $newPassword) {
    ...AdminCustomerFields
  }
}
